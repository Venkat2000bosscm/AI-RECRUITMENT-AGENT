trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Backend
        displayName: Backend tests and lint
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python -m pip install -r requirements-dev.txt
            workingDirectory: backend
            displayName: Install backend dependencies
          - script: ruff check app scripts tests migrations
            workingDirectory: backend
            displayName: Ruff
          - script: python -m pytest -q
            workingDirectory: backend
            displayName: Backend tests

      - job: Frontend
        displayName: Frontend build
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - script: npm ci
            workingDirectory: frontend
            displayName: Install frontend dependencies
          - script: npm run build
            workingDirectory: frontend
            displayName: Build frontend

  - stage: ValidateContainers
    displayName: Validate container images
    dependsOn: Validate
    jobs:
      - job: BuildImages
        displayName: Build API and UI images
        steps:
          - checkout: self
          - script: docker build -f backend/Dockerfile -t recruitment-api:$(Build.BuildId) backend
            displayName: Build backend image
          - script: docker build -f frontend/Dockerfile -t recruitment-ui:$(Build.BuildId) frontend
            displayName: Build frontend image
