trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Backend
        displayName: Backend tests and lint
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python -m pip install -r requirements-dev.txt
            workingDirectory: backend
            displayName: Install backend dependencies
          - script: ruff check app scripts tests migrations
            workingDirectory: backend
            displayName: Ruff
          - script: python -m pytest -q
            workingDirectory: backend
            displayName: Backend tests

      - job: Frontend
        displayName: Frontend build
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
          - script: npm ci
            workingDirectory: frontend
            displayName: Install frontend dependencies
          - script: npm run build
            workingDirectory: frontend
            displayName: Build frontend

  - stage: PushImages
    displayName: Build and push images to ACR
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndPush
        displayName: Build and push API and UI images
        steps:
          - checkout: self
          - task: Docker@2
            displayName: Build and push backend image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: recruitment-api
              Dockerfile: $(Build.SourcesDirectory)/backend/Dockerfile
              buildContext: $(Build.SourcesDirectory)/backend
              tags: |
                $(Build.BuildId)
                latest
          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: recruitment-ui
              Dockerfile: $(Build.SourcesDirectory)/frontend/Dockerfile
              buildContext: $(Build.SourcesDirectory)/frontend
              tags: |
                $(Build.BuildId)
                latest
